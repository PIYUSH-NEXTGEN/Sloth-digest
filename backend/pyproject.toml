[project]
name = "slothdigest-backend"
version = "0.1.0"
description = "SlothDigest local-first chat digest - backend (FastAPI + Ollama)"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
sentry = [
    "sentry-sdk[fastapi]>=2.0",
]
temporal = [
    "temporalio>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "temporalio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "make_dataset"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["compare", "train_tinker"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
